<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인시던트 노트 — 이메일 침해 초동대응 에이전트</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">IN</span>
      <div>
        <h1>인시던트 노트</h1>
        <p>이메일 침해 초동대응 에이전트 · Liner .EXE-THON 2026</p>
      </div>
    </div>
    <div class="casehead">
      <div id="caseTitle" class="case-title">사건을 시작하세요</div>
      <div id="caseMeta" class="case-meta">인지 시각 미확인</div>
    </div>
    <div class="status-group">
      <div id="sevBadge" class="sev sev-none">—</div>
      <div id="modePill" class="pill">확인 중</div>
    </div>
  </header>

  <div class="toolbar">
    <label class="lbl" for="scenario">데모 시나리오</label>
    <select id="scenario"></select>
    <button id="runScenario" class="btn primary">시나리오 실행</button>
    <button id="newCase" class="btn">새 사건</button>
    <button id="makeDocs" class="btn">문서 초안 생성</button>
    <span class="spacer"></span>
    <span id="apiInfo" class="api-info"></span>
  </div>

  <main class="grid">
    <section class="panel chat-panel">
      <div class="panel-head"><h2>대화</h2><span class="hint">로그·메일 원본을 그대로 붙여넣어도 됩니다</span></div>
      <div id="chat" class="chat"></div>
      <div class="composer">
        <textarea id="input" rows="3" placeholder="예) 거래처에서 우리가 계좌를 바꿨냐고 전화가 왔어요. 우리는 바꾼 적이 없습니다."></textarea>
        <div class="composer-actions">
          <span class="hint" id="typing"></span>
          <button id="send" class="btn primary">보내기</button>
        </div>
      </div>
    </section>

    <section class="panel center-panel">
      <div class="panel-head"><h2>지금 할 일</h2><span id="phaseLabel" class="hint"></span></div>
      <ol id="actions" class="actions"></ol>

      <div class="panel-head"><h2>신고·통지 기한</h2><span class="hint">결정적 규칙 + Liner 검색으로 재확인</span></div>
      <div id="deadlines" class="deadlines"></div>

      <div class="panel-head"><h2>타임라인</h2><span class="hint">UTC 원본 / KST 병기</span></div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="panel right-panel">
      <div class="panel-head"><h2>판정</h2></div>
      <div id="verdict" class="verdict"></div>

      <div class="panel-head"><h2>하지 말 것</h2></div>
      <ul id="dontdo" class="dontdo"></ul>

      <div class="panel-head"><h2>확인 / 추정 / 미확인</h2></div>
      <div id="facts" class="facts"></div>

      <div class="panel-head"><h2>문서</h2><span class="hint">발송은 사람이</span></div>
      <div id="docs" class="docs"></div>

      <div class="panel-head"><h2>Liner 근거</h2></div>
      <div id="sources" class="sources"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">문서</h3>
        <div>
          <a id="modalDownload" class="btn small" href="#">MD 다운로드</a>
          <button class="btn small" onclick="document.getElementById('modal').classList.add('hidden')">닫기</button>
        </div>
      </div>
      <pre id="modalBody"></pre>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
